spring.application.name=generate-article
spring.profiles.active=test

server.port=9101
server.servlet.context-path=/generate-article
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
spring.mvc.format.date=yyyy-MM-dd
spring.mvc.format.date-time=yyyy-MM-dd HH:mm:ss
spring.mvc.format.time=HH:mm:ss

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.huoli.hlai.generate.article.model.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=false
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30

logging.file.path=logs/${spring.application.name}
logging.charset.console=UTF-8
logging.charset.file=UTF-8
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.redis=INFO
logging.level.org.mybatis=INFO
logging.level.com.huoli.hlai.generate.article=INFO
logging.level.org.springdoc=DEBUG
logging.level.io.swagger=DEBUG

# SpringDoc OpenAPI (Swagger)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ????????
hotspot.time-window.days=7
