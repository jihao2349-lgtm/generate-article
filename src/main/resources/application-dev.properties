spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_generate_article}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=5s
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
spring.data.redis.lettuce.pool.max-wait=5s

logging.file.name=logs/${spring.application.name}/${spring.application.name}-dev.log
logging.level.org.mybatis=DEBUG
logging.level.com.huoli.hlai.generate.article=DEBUG

# Spring AI Alibaba - DashScope Configuration
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY}
spring.ai.dashscope.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
spring.ai.dashscope.chat.options.model=qwen-plus

# Baidu Qianfan AI Search Configuration
baidu.qianfan.api-key=${BAIDU_QIANFAN_API_KEY}
baidu.qianfan.base-url=https://qianfan.baidubce.com/v2

# DeepSeek AI Model Configuration
deepseek.api-key=${DEEPSEEK_API_KEY}
deepseek.base-url=https://api.deepseek.com/v1
deepseek.model=deepseek-chat

# Kimi AI Model Configuration
kimi.api-key=${KIMI_API_KEY}
kimi.base-url=https://api.moonshot.cn/v1
kimi.model=moonshot-v1-8k

# Doubao AI Model Configuration
doubao.api-key=${DOUBAO_API_KEY}
doubao.base-url=https://ark.cn-beijing.volces.com/api/v3
doubao.model=doubao-pro-32k

# File Upload
file.upload.path=${FILE_UPLOAD_PATH:/tmp/upload/}
file.upload.max-size=50MB
file.upload.allowed-types=pdf,docx,doc,txt
